name: Streaming 7z WASM prototype

on:
  push:
    branches:
      - issue-3-streaming-7z-wasm
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run contract tests
        run: npm test


  direct-browser-payload:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: emscripten/emsdk@sha256:d0be652409a4d3362b8a36c3279dd1123ff1c9327e603d86d9361aa84f1d2e4c
    steps:
      - uses: actions/checkout@v4

      - name: Install direct-build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl xz-utils make

      - name: Build verified direct 7-Zip API payload
        shell: bash
        run: bash prototype/7zip-direct/build.sh

      - name: Emit compressed browser payload for Git-object import
        shell: bash
        run: |
          echo 'STREAM7Z_MJS_GZ_BASE64_BEGIN'
          gzip -9 -c prototype/7zip-direct/build/stream7z.mjs | base64 -w0
          echo
          echo 'STREAM7Z_MJS_GZ_BASE64_END'
          echo 'STREAM7Z_WASM_GZ_BASE64_BEGIN'
          gzip -9 -c prototype/7zip-direct/build/stream7z.wasm | base64 -w0
          echo
          echo 'STREAM7Z_WASM_GZ_BASE64_END'

      - name: Upload verified direct browser payload
        uses: actions/upload-artifact@v4
        with:
          name: direct-browser-payload
          path: |
            prototype/7zip-direct/build/stream7z.mjs
            prototype/7zip-direct/build/stream7z.wasm
          if-no-files-found: error

  wasm-streaming:
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 45
    container:
      image: emscripten/emsdk@sha256:d0be652409a4d3362b8a36c3279dd1123ff1c9327e603d86d9361aa84f1d2e4c
    steps:
      - uses: actions/checkout@v4

      - name: Install build and verification tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl xz-utils pkg-config make nodejs npm p7zip-full

      - name: Install benchmark dependencies
        run: npm install --no-audit --no-fund

      - name: Build direct 7-Zip API WASM module
        shell: bash
        run: bash prototype/7zip-direct/build.sh

      - name: Verify direct 7-Zip API byte identity
        run: node prototype/7zip-direct/verify.mjs

      - name: Run embedded-Wasm compression/decompression test bench
        env:
          SEVEN_ZIP: 7z
        run: node prototype/7zip-direct/testbench.mjs

      - name: Build direct libarchive WASM module
        shell: bash
        run: |
          set -o pipefail
          bash prototype/libarchive-streaming/build.sh 2>&1 \
            | tee prototype/libarchive-streaming/build.log

      - name: Verify streaming decompress to continuous compress
        run: node prototype/libarchive-streaming/verify.mjs

      - name: Package verified streaming browser payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gzip -9 -n -c prototype/libarchive-streaming/build/stream7z.mjs \
            > dist/streaming7z-libarchive.mjs.gz
          gzip -9 -n -c prototype/libarchive-streaming/build/stream7z.wasm \
            > dist/streaming7z-libarchive.wasm.gz
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const sourceCommit = process.env.GITHUB_SHA;
          const files = {};
          for (const [name, raw, compressed] of [
            ['stream7z.mjs',
              'prototype/libarchive-streaming/build/stream7z.mjs',
              'streaming7z-libarchive.mjs.gz'],
            ['stream7z.wasm',
              'prototype/libarchive-streaming/build/stream7z.wasm',
              'streaming7z-libarchive.wasm.gz']
          ]) {
            const bytes = await readFile(raw);
            files[name] = {
              compressed,
              bytes: bytes.length,
              sha256: createHash('sha256').update(bytes).digest('hex')
            };
          }
          await writeFile(
            'dist/streaming7z-libarchive.json',
            JSON.stringify({ schema: 1, source_commit: sourceCommit, files }, null, 2) + '\n'
          );
          NODE


      - name: Benchmark direct WASM against JS7z and native 7z
        run: node prototype/libarchive-streaming/benchmark.mjs

      - name: Re-run repository tests after build
        env:
          STREAMING_DIST_VERIFY: '1'
        run: npm test

      - name: Emit verified streaming gzip for Git-object import
        shell: bash
        run: |
          echo 'STREAMING7Z_MJS_GZ_BASE64_BEGIN'
          base64 -w0 dist/streaming7z-libarchive.mjs.gz
          echo
          echo 'STREAMING7Z_MJS_GZ_BASE64_END'

      - name: Upload streaming diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-7z-wasm-results
          path: |
            prototype/7zip-direct/build/stream7z.mjs
            prototype/7zip-direct/build/stream7z.wasm
            prototype/libarchive-streaming/build.log
            prototype/libarchive-streaming/build/stream7z.mjs
            prototype/libarchive-streaming/build/stream7z.wasm
            dist/streaming7z-libarchive.mjs.gz
            dist/streaming7z-libarchive.wasm.gz
            dist/streaming7z-libarchive.json
            benchmark-results/streaming-wasm-results.json
            benchmark-results/streaming-performance-results.json
            .streaming-work/(1).7z
            .streaming-work/js7z-reference.7z
            .streaming-work/native-single-input.7z
            .streaming-work/expected-concatenation.jsonl
          if-no-files-found: warn
